<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Display a GIF</title>
</head>
<body>

    <h1>My Animated GIF</h1>
    
    <!-- Example using a local file (must be in the same folder as index.html) -->
    <img src="my-animation.gif" alt="Description of the animation" width="300">

    <!-- Example using a direct web URL -->
    <img src="https://media.giphy.com/media/jUwpNzg9IcyrK/giphy.gif" alt="Homer Simpson backing into bushes" width="300">

</body>
</html>
