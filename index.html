    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;700&display=swap');
        
        body {
            font-family: 'Outfit', sans-serif;
            background-color: #050505;
        }

        /* Ambient Background Animations */
        @keyframes blob {
            0% { transform: translate(0px, 0px) scale(1); }
            33% { transform: translate(30px, -50px) scale(1.1); }
            66% { transform: translate(-20px, 20px) scale(0.9); }
            100% { transform: translate(0px, 0px) scale(1); }
        }
        .animate-blob {
            animation: blob 7s infinite;
        }
        .animation-delay-2000 {
            animation-delay: 2s;
        }
        
        /* Smooth Masonry Column Break Avoidance */
        .masonry-item {
            break-inside: avoid;
            margin-bottom: 1.5rem;
        }
    </style>
</head>

    <!-- Fullscreen Lightbox Modal -->
    <div id="lightbox" class="fixed inset-0 z-[100] hidden bg-black/95 backdrop-blur-md flex items-center justify-center opacity-0 transition-opacity duration-300" onclick="closeLightbox()">
        <!-- Close Button -->
        <button class="absolute top-8 right-8 text-white/70 hover:text-white transition-colors p-2 bg-white/10 hover:bg-white/20 rounded-full" onclick="closeLightbox()">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
        </button>
        <!-- Lightbox Image -->
        <img id="lightbox-img" src="" alt="Expanded Image" class="max-w-[95vw] max-h-[90vh] object-contain rounded-lg shadow-2xl scale-95 transition-transform duration-300" onclick="event.stopPropagation()">
    </div>

    <script>
        // --- Lightbox Logic ---
        const lightbox = document.getElementById('lightbox');
        const lightboxImg = document.getElementById('lightbox-img');

        function openLightbox(imageSrc) {
            lightboxImg.src = imageSrc;
            lightbox.classList.remove('hidden');
            
            // Trigger reflow to allow transition to play
            void lightbox.offsetWidth; 
            
            lightbox.classList.remove('opacity-0');
            lightboxImg.classList.remove('scale-95');
            document.body.style.overflow = 'hidden'; // Prevent background scrolling
        }

        function closeLightbox() {
            lightbox.classList.add('opacity-0');
            lightboxImg.classList.add('scale-95');
            
            setTimeout(() => {
                lightbox.classList.add('hidden');
                lightboxImg.src = ''; // Clear image
                document.body.style.overflow = 'auto'; // Restore scrolling
            }, 300);
        }

        // Add keyboard support to close lightbox with Escape key
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && !lightbox.classList.contains('hidden')) {
                closeLightbox();
            }
        });

        // --- Background Audio Logic ---
        const bgMusic = document.getElementById('bg-music');
        const musicToggle = document.getElementById('music-toggle');
        const iconPlaying = document.getElementById('icon-playing');
        const iconMuted = document.getElementById('icon-muted');
        const musicStatusText = document.getElementById('music-status-text');

        // Moderate ambient volume
        bgMusic.volume = 0.4;

        function updateAudioUI(isPlaying) {
            if (isPlaying) {
                iconPlaying.classList.remove('hidden');
                iconMuted.classList.add('hidden');
                musicStatusText.textContent = 'Mute';
            } else {
                iconPlaying.classList.add('hidden');
                iconMuted.classList.remove('hidden');
                musicStatusText.textContent = 'Play Music';
            }
        }

        function toggleMusic() {
            if (bgMusic.paused) {
                bgMusic.play().then(() => updateAudioUI(true)).catch(console.warn);
            } else {
                bgMusic.pause();
                updateAudioUI(false);
            }
        }

        musicToggle.addEventListener('click', (e) => {
            e.stopPropagation();
            toggleMusic();
        });

        // --- Trigger Play on First Gesture / Scroll ---
        const triggerEvents = ['scroll', 'wheel', 'touchmove', 'touchstart', 'click'];

        const triggerPlayOnGesture = () => {
            if (bgMusic.paused) {
                bgMusic.play()
                    .then(() => {
                        updateAudioUI(true);
                        // Clean up all listeners once playing successfully
                        triggerEvents.forEach(evt => {
                            window.removeEventListener(evt, triggerPlayOnGesture);
                        });
                    })
                    .catch(() => {
                        // Suppress warnings if strict browser autoplay blocked wheel scrolls;
                        // remaining listeners will catch touch or click gestures.
                    });
            }
        };

        // Attach listeners across scrolling and interactive events
        triggerEvents.forEach(evt => {
            window.addEventListener(evt, triggerPlayOnGesture, { passive: true });
        });
    </script>
